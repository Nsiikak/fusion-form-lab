<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="X-UA-Compatible" content="IE=edge" />
<title>{heading}</title>
<style type="text/css">
  body, table, td, p, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
  table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
  img { border: 0; height: auto; outline: none; text-decoration: none; }
  @media screen and (max-width: 600px) {
    .email-wrapper { padding: 12px !important; }
    .email-card { border-radius: 8px !important; }
    .content-pad { padding: 32px 24px !important; }
    .header-pad { padding: 24px !important; }
  }
</style>
</head>
<body style="margin:0;padding:0;background-color:#F4F4F5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;">

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#F4F4F5;">
<tr><td align="center" class="email-wrapper" style="padding:40px 16px;">

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;">

    <!-- Accent bar -->
    <tr><td style="height:4px;background:#E8770E;border-radius:8px 8px 0 0;font-size:0;line-height:0;">&nbsp;</td></tr>

    <!-- Card -->
    <tr><td class="email-card" style="background:#ffffff;border-radius:0 0 12px 12px;overflow:hidden;">

      <!-- Header -->
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
        <tr>
          <td class="header-pad" style="padding:32px 40px;border-bottom:1px solid #F4F4F5;" align="center">
            <img src="{frontend_url}/plagohive-email-logo.png" alt="Plagohive" width="140" style="display:block;max-width:140px;" />
          </td>
        </tr>
      </table>

      <!-- Body -->
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
        <tr>
          <td class="content-pad" style="padding:40px 40px 32px;">

            <p style="margin:0 0 6px;font-size:13px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#B8520B;">{eyebrow}</p>
            <h1 style="margin:0 0 16px;font-size:26px;font-weight:800;color:#0D1B2A;letter-spacing:-0.02em;line-height:1.2;">
              {heading}
            </h1>

            {body_html}

            <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin-top:8px;">
              <tr>
                <td style="border-radius:10px;background:#B8520B;" align="center">
                  <a href="{cta_url}" target="_blank"
                     style="display:inline-block;padding:14px 32px;font-size:15px;font-weight:700;color:#ffffff;text-decoration:none;border-radius:10px;letter-spacing:0.01em;">
                    {cta_text}
                  </a>
                </td>
              </tr>
            </table>

          </td>
        </tr>
      </table>

      <!-- Footer -->
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
        <tr>
          <td style="padding:24px 40px;background:#FAFAFA;border-top:1px solid #F4F4F5;" align="center">
            <p style="margin:0 0 8px;font-size:12px;color:#A1A1AA;">
              © {year} Plagohive · Book verified event vendors<br />{sent_stamp}
            </p>
            <p style="margin:0;font-size:12px;">
              <a href="{frontend_url}/unsubscribe?token={unsubscribe_token}&email={email}" style="color:#A1A1AA;text-decoration:none;">Unsubscribe</a>
            </p>
          </td>
        </tr>
      </table>

    </td></tr>

  </table>

</td></tr>
</table>

</body>
</html>
