<svg width="240" height="60" viewBox="0 0 240 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Chain link icon -->
  <g transform="translate(8, 15)">
    <!-- Yellow/Gold chain link (vertical) -->
    <rect x="0" y="6" width="12" height="20" rx="6" stroke="#FDB022" stroke-width="4" fill="none"/>
    
    <!-- Red/Coral chain link (horizontal, interlocked) -->
    <rect x="7" y="11" width="24" height="12" rx="6" stroke="#E74C3C" stroke-width="4" fill="none"/>
    
    <!-- Blue connection dot -->
    <circle cx="12" cy="17" r="2.5" fill="#1E40AF"/>
    
    <!-- Blue sparkles/connection effects -->
    <line x1="2" y1="4" x2="0" y2="2" stroke="#1E40AF" stroke-width="2" stroke-linecap="round"/>
    <line x1="10" y1="4" x2="12" y2="2" stroke="#1E40AF" stroke-width="2" stroke-linecap="round"/>
    <line x1="29" y1="9" x2="32" y2="7" stroke="#1E40AF" stroke-width="2" stroke-linecap="round"/>
    <line x1="33" y1="17" x2="36" y2="17" stroke="#1E40AF" stroke-width="2" stroke-linecap="round"/>
    <line x1="29" y1="25" x2="32" y2="27" stroke="#1E40AF" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <!-- Text "plagohive" -->
  <text x="60" y="38" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="700" fill="#1E40AF">plagohive</text>
</svg>
