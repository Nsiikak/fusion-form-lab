<svg width="240" height="60" viewBox="0 0 240 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Chain link icon -->
  <g transform="translate(12, 18)">
    <!-- Yellow chain link (left, diagonal top-left to bottom-right) -->
    <ellipse cx="6" cy="12" rx="4" ry="8" stroke="#FDB022" stroke-width="4" fill="none" transform="rotate(-45 6 12)"/>
    
    <!-- Red chain link (right, diagonal top-right to bottom-left, interlocked) -->
    <ellipse cx="18" cy="12" rx="4" ry="8" stroke="#E74C3C" stroke-width="4" fill="none" transform="rotate(45 18 12)"/>
    
    <!-- Blue connection dot at center -->
    <circle cx="12" cy="12" r="2" fill="#1E40AF"/>
  </g>
  
  <!-- Text "plagohive" -->
  <text x="60" y="38" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="700" fill="#1E40AF">plagohive</text>
</svg>
