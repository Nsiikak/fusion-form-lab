<svg width="240" height="60" viewBox="0 0 240 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Chain link icon -->
  <g transform="translate(10, 15)">
    <!-- Yellow chain link (left, diagonal) -->
    <path d="M 5 8 L 12 15 L 5 22 L -2 15 Z" stroke="#FDB022" stroke-width="4" fill="none" stroke-linejoin="round"/>
    <path d="M 5 8 Q 8 8, 10 10" stroke="#FDB022" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M 5 22 Q 8 22, 10 20" stroke="#FDB022" stroke-width="4" fill="none" stroke-linecap="round"/>
    
    <!-- Red chain link (right, diagonal, interlocked) -->
    <path d="M 22 8 L 29 15 L 22 22 L 15 15 Z" stroke="#E74C3C" stroke-width="4" fill="none" stroke-linejoin="round"/>
    <path d="M 22 8 Q 19 8, 17 10" stroke="#E74C3C" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M 22 22 Q 19 22, 17 20" stroke="#E74C3C" stroke-width="4" fill="none" stroke-linecap="round"/>
    
    <!-- Blue connection sparkles -->
    <circle cx="13.5" cy="15" r="2" fill="#1E40AF"/>
    <line x1="0" y1="15" x2="-3" y2="15" stroke="#1E40AF" stroke-width="2" stroke-linecap="round"/>
    <line x1="32" y1="15" x2="35" y2="15" stroke="#1E40AF" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <!-- Text "plagohive" -->
  <text x="60" y="38" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="700" fill="#1E40AF">plagohive</text>
</svg>
