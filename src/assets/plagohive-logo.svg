<svg width="200" height="60" viewBox="0 0 200 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Chain icon -->
  <g transform="translate(10, 15)">
    <!-- Yellow link -->
    <ellipse cx="8" cy="15" rx="6" ry="10" stroke="#F59E0B" stroke-width="3.5" fill="none" transform="rotate(-45 8 15)"/>
    <!-- Red link -->
    <ellipse cx="22" cy="15" rx="6" ry="10" stroke="#EF4444" stroke-width="3.5" fill="none" transform="rotate(45 22 15)"/>
    <!-- Blue dot -->
    <circle cx="15" cy="15" r="3" fill="#1E40AF"/>
    <!-- Sparkles -->
    <line x1="4" y1="10" x2="6" y2="8" stroke="#1E40AF" stroke-width="2" stroke-linecap="round"/>
    <line x1="2" y1="15" x2="0" y2="15" stroke="#1E40AF" stroke-width="2" stroke-linecap="round"/>
    <line x1="4" y1="20" x2="6" y2="22" stroke="#1E40AF" stroke-width="2" stroke-linecap="round"/>
    <line x1="26" y1="10" x2="28" y2="8" stroke="#1E40AF" stroke-width="2" stroke-linecap="round"/>
    <line x1="28" y1="15" x2="30" y2="15" stroke="#1E40AF" stroke-width="2" stroke-linecap="round"/>
    <line x1="26" y1="20" x2="28" y2="22" stroke="#1E40AF" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <!-- Text "plagohive" -->
  <text x="50" y="35" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="700" fill="#1E40AF">plagohive</text>
</svg>
